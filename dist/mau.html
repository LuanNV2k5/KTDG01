<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLB Đọc sách · Sản phẩm mẫu</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><body class="sample-site"><header class="sample-header"><a class="brand" href="#home"><span class="logo">Đ</span>CLB Đọc sách</a><nav style="display:flex"><a href="#home">Trang chủ</a><a href="#activity">Hoạt động</a><a href="#join">Tham gia</a></nav><a href="index.html#hoc-lieu">Về WebQuest</a></header><main id="sample" tabindex="-1"></main><footer><div><b>CLB Đọc sách · Website mẫu</b><p>Thông tin và lịch hoạt động dưới đây là giả định, dùng để minh họa nhiệm vụ học tập.</p></div></footer><script>
const screens={home:`<div class="eyebrow">CLB giả định · Mẫu học tập</div><h1>Mở một cuốn sách.<br>Mở thêm góc nhìn.</h1><p class="lead">Cùng đọc, trao đổi và chia sẻ những điều em tìm thấy qua từng trang sách.</p><div class="actions"><a class="button" href="#activity">Khám phá hoạt động</a><a class="button alt" href="#join">Tham gia CLB</a></div><h2>CLB dành cho ai?</h2><p>Dành cho học sinh yêu thích đọc sách hoặc muốn bắt đầu thói quen đọc. Không yêu cầu đọc nhanh hay đã đọc nhiều sách; điều cần thiết là sẵn sàng lắng nghe và chia sẻ.</p><div class="grid"><article class="card"><h3>Đọc cùng nhau</h3><p>Chọn một chủ đề và trao đổi cách hiểu của mỗi người.</p></article><article class="card tint"><h3>Chia sẻ điều hay</h3><p>Giới thiệu cuốn sách em yêu thích bằng một bài viết ngắn.</p></article><article class="card yellow"><h3>Lắng nghe khác biệt</h3><p>Tôn trọng quan điểm của bạn và giải thích bằng dẫn chứng.</p></article></div><h2>Ảnh đại diện mẫu</h2><img alt="Minh họa AI: học sinh cùng đọc sách trong thư viện giả định" src="assets/reading-clay.webp" style="width:100%;max-width:680px;border-radius:16px"><p>Minh họa được tạo bằng AI cho CLB giả định; không phải ảnh hoạt động thực tế.</p>`,activity:`<div class="eyebrow">Hoạt động · Thông tin giả định</div><h1>Mỗi buổi đọc, một cuộc trò chuyện</h1><div class="grid"><article class="card"><h3>Góc sách tháng này</h3><p>Mỗi thành viên giới thiệu một cuốn sách và một điều muốn thảo luận. Chuẩn bị một đoạn giới thiệu ngắn trước buổi gặp.</p><p><b>Lịch mẫu:</b> 15:30 thứ Sáu đầu tháng, tại thư viện giả định.</p></article><article class="card tint"><h3>Đọc và đối thoại</h3><p>Cùng đọc một đoạn văn, chọn dẫn chứng và trao đổi cách hiểu. Người mới có thể nghe trước khi chia sẻ.</p><p><b>Lịch mẫu:</b> 15:30 thứ Sáu tuần thứ ba, tại thư viện giả định.</p></article><article class="card yellow"><h3>Giới thiệu sách</h3><p>Làm bài viết ngắn giới thiệu nội dung và lí do nên đọc; trao đổi với bạn trước khi đăng lên trang CLB.</p><p><b>Tham gia:</b> Chọn hoạt động này trong biểu mẫu.</p></article></div><div class="notice">Các mốc thời gian và địa điểm chỉ là ví dụ học tập. Khi làm website cho CLB thật, cần xác nhận với người phụ trách.</div><a class="button" href="#join">Xem điều kiện tham gia</a>`,join:`<div class="eyebrow">Tham gia · Biểu mẫu minh họa</div><h1>Bắt đầu từ cuốn sách em thích</h1><p>Đối tượng: học sinh quan tâm đến đọc sách. Điều kiện: tôn trọng ý kiến khác nhau, chuẩn bị phần đọc đã thống nhất và tham gia theo khả năng.</p><ol><li>Đọc nội dung hoạt động.</li><li>Chọn hoạt động quan tâm trong biểu mẫu.</li><li>CLB thực tế sẽ phản hồi qua kênh do trường thống nhất.</li></ol><div class="notice">Form này chỉ minh họa, không gửi hoặc lưu dữ liệu. Dùng tên giả. Trong sản phẩm Google Sites, nhóm nhúng Google Form của CLB và thêm nút mở riêng.</div><form class="card" id="demo"><label>Tên dùng thử<input required name="name" placeholder="Ví dụ: Bạn A" style="display:block;padding:12px;width:100%;margin:8px 0 18px"></label><label>Lớp dùng thử<input required name="class" placeholder="Ví dụ: 12A" style="display:block;padding:12px;width:100%;margin:8px 0 18px"></label><label>Hoạt động quan tâm<select style="display:block;padding:12px;width:100%;margin:8px 0 18px"><option>Góc sách tháng này</option><option>Đọc và đối thoại</option><option>Giới thiệu sách</option></select></label><button class="button">Thử gửi đăng ký</button><p id="result" role="status"></p></form>`};function show(){let key=location.hash.slice(1)||'home';document.getElementById('sample').innerHTML=screens[key]||screens.home;window.scrollTo(0,0);let f=document.getElementById('demo');if(f)f.onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='Đã hoàn thành thao tác thử. Không có dữ liệu nào được gửi hoặc lưu.'}}onhashchange=show;show();</script></body></html>
